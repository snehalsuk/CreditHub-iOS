name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: |
          xcodebuild build \
            -scheme CreditHub \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test with coverage
        run: |
          xcodebuild test \
            -scheme CreditHub \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -skipMacroValidation \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Enforce coverage floor
        run: |
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult | \
            python3 -c "import json,sys; data=json.load(sys.stdin); print(next(t['lineCoverage'] for t in data['targets'] if t['name'] == 'CreditHub.app'))")
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
          echo "Line coverage: ${COVERAGE_PCT}%"
          if (( $(echo "$COVERAGE < 0.50" | bc -l) )); then
            echo "::error::Line coverage ${COVERAGE_PCT}% is below the 50% floor."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
